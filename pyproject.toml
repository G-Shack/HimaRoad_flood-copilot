[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "himaroad"
version = "1.0.0"
description = "Flood mapping, cut-off settlement screening and EN/NE situation-report copilot (Track B)"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "rasterio==1.4.4",
  "geopandas==1.2.0",
  "shapely==2.2.0",
  "pyproj==3.7.2",
  "networkx==3.6.1",
  "streamlit==1.65.0",
  "plotly==7.1.0",
  "reportlab==5.0.1",
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "scipy==1.17.1",
  "Pillow==12.3.0",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
  "nepali-datetime==1.0.8.5",
  "weasyprint==70.0",
  "matplotlib==3.10.8",
  "pypdf==6.8.0",
]

[project.optional-dependencies]
unet = ["torch"]
video = ["playwright"]

[project.scripts]
himaroad = "himaroad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
himaroad = ["*.yaml"]

[tool.uv]
no-build-package = ["numpy", "pandas", "rasterio", "geopandas", "shapely", "pyproj", "scipy", "pillow"]
